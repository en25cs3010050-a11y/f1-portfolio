name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract source into the repository and prepare Pages files
        run: |
          if [ -f f1-portfolio.zip ]; then
            mkdir _source
            unzip -q f1-portfolio.zip -d _source
            rsync -a _source/ ./
            rm -rf _source f1-portfolio.zip
            git add -A
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Extract website source archive'
              git push
            fi
          fi
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='README.md' --exclude='Readme.txt' --exclude='forms/*.php' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
